<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucide Icons Offline Studio</title>

  <!-- Favicon using logo.svg -->
  <link rel="icon" type="image/svg+xml" href="./logo.svg">

  <!-- Local Offline Lucide Bundle -->
  <script src="./lucide.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #1e293b;
      --surface-hover: #243248;
      --border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;

      /* Dynamic Icon Variables */
      --icon-size: 28px;
      --icon-stroke: #f8fafc;
      --icon-stroke-width: 2px;
      --icon-fill: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 1.5rem;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
    }

    /* Header & Branding with logo.svg */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      gap: 0.75rem;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* Sticky Control Deck */
    .controls-panel {
      position: sticky;
      top: 1rem;
      z-index: 50;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-row {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 0.65rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .stats {
      font-size: 0.85rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    /* Live Styling Sliders & Controls */
    .modifiers-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .ctrl-group label {
      font-weight: 500;
      color: var(--text-main);
    }

    .ctrl-group input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 90px;
    }

    .ctrl-group input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid var(--border);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: none;
      cursor: pointer;
    }

    .ctrl-group input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .ctrl-group input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 5px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }

    .copy-mode {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .copy-mode select {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Gallery Grid */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .icon-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
      text-align: center;
    }

    .icon-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      background: var(--surface-hover);
    }

    /* All icons react to CSS custom variables instantly without re-rendering */
    .icon-card svg {
      width: var(--icon-size);
      height: var(--icon-size);
      stroke: var(--icon-stroke) !important;
      stroke-width: var(--icon-stroke-width) !important;
      fill: var(--icon-fill) !important;
      transition: width 0.1s, height 0.1s;
    }

    .icon-card .name {
      font-size: 0.75rem;
      color: var(--text-sub);
      word-break: break-word;
      line-height: 1.2;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent);
      color: #0b0f19;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
      font-size: 0.9rem;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <div class="brand">
        <img src="./logo.svg" alt="App Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Lucide Icons Offline Studio</h1>
      </div>
      <p>Offline browser with live control over Stroke, Fill, Size, and Color.</p>
    </header>

    <div class="controls-panel">
      <!-- Search Bar -->
      <div class="search-row">
        <input type="text" id="search" class="search-input"
          placeholder="Filter icons by name (e.g. arrow, chevron, file, settings)..." autocomplete="off">
        <div id="stats" class="stats">Loading icons...</div>
      </div>

      <!-- Live Customization Bar -->
      <div class="modifiers-row">
        <!-- Size -->
        <div class="ctrl-group">
          <label for="inputSize">Size:</label>
          <input type="range" id="inputSize" min="16" max="64" value="28">
          <span id="valSize">28px</span>
        </div>

        <!-- Stroke Width -->
        <div class="ctrl-group">
          <label for="inputStrokeWidth">Stroke:</label>
          <input type="range" id="inputStrokeWidth" min="0.5" max="3" step="0.25" value="2">
          <span id="valStrokeWidth">2px</span>
        </div>

        <!-- Stroke Color -->
        <div class="ctrl-group">
          <label for="inputStrokeColor">Stroke Color:</label>
          <input type="color" id="inputStrokeColor" value="#f8fafc">
        </div>

        <!-- Fill Color & Toggle -->
        <div class="ctrl-group">
          <label for="inputFillColor">Fill Color:</label>
          <input type="color" id="inputFillColor" value="#38bdf8" disabled>
          <label class="checkbox-group">
            <input type="checkbox" id="checkFillNone" checked>
            <span>None</span>
          </label>
        </div>

        <!-- Target Snippet Format -->
        <div class="copy-mode">
          <label for="selectCopyMode">Format on click:</label>
          <select id="selectCopyMode">
            <option value="react">React Component (&lt;Icon /&gt;)</option>
            <option value="svg">Inline SVG Code</option>
            <option value="html">HTML (&lt;i data-lucide&gt;)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Active Icon Gallery Grid -->
    <div id="grid" class="icon-grid"></div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    function toPascalCase(str) {
      return str
        .split('-')
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join('');
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide === 'undefined') {
        alert("Lucide bundle failed to load. Make sure `lucide.min.js` is present in the same directory.");
        return;
      }

      const root = document.documentElement;
      const allIcons = Object.keys(lucide.icons);
      const grid = document.getElementById('grid');
      const search = document.getElementById('search');
      const stats = document.getElementById('stats');

      // Controls
      const inputSize = document.getElementById('inputSize');
      const valSize = document.getElementById('valSize');
      const inputStrokeWidth = document.getElementById('inputStrokeWidth');
      const valStrokeWidth = document.getElementById('valStrokeWidth');
      const inputStrokeColor = document.getElementById('inputStrokeColor');
      const inputFillColor = document.getElementById('inputFillColor');
      const checkFillNone = document.getElementById('checkFillNone');
      const selectCopyMode = document.getElementById('selectCopyMode');

      // Current State
      const state = {
        size: 28,
        strokeWidth: 2,
        strokeColor: '#f8fafc',
        fillColor: 'none',
        copyMode: 'react'
      };

      // Real-time CSS Custom Property mapping (Zero-cost instantaneous DOM updates)
      function updateCustomProperties() {
        root.style.setProperty('--icon-size', `${state.size}px`);
        root.style.setProperty('--icon-stroke-width', `${state.strokeWidth}px`);
        root.style.setProperty('--icon-stroke', state.strokeColor);
        root.style.setProperty('--icon-fill', state.fillColor);
      }

      // Input Event Handlers
      inputSize.addEventListener('input', (e) => {
        state.size = e.target.value;
        valSize.textContent = `${state.size}px`;
        updateCustomProperties();
      });

      inputStrokeWidth.addEventListener('input', (e) => {
        state.strokeWidth = e.target.value;
        valStrokeWidth.textContent = `${state.strokeWidth}px`;
        updateCustomProperties();
      });

      inputStrokeColor.addEventListener('input', (e) => {
        state.strokeColor = e.target.value;
        updateCustomProperties();
      });

      function handleFillChange() {
        if (checkFillNone.checked) {
          inputFillColor.disabled = true;
          state.fillColor = 'none';
        } else {
          inputFillColor.disabled = false;
          state.fillColor = inputFillColor.value;
        }
        updateCustomProperties();
      }

      checkFillNone.addEventListener('change', handleFillChange);
      inputFillColor.addEventListener('input', () => {
        if (!checkFillNone.checked) {
          state.fillColor = inputFillColor.value;
          updateCustomProperties();
        }
      });

      selectCopyMode.addEventListener('change', (e) => {
        state.copyMode = e.target.value;
      });

      // Snippet generator with active user customization
      function getCopySnippet(iconName, cardElement) {
        const pascalName = toPascalCase(iconName);
        const fillProp = state.fillColor !== 'none' ? ` fill="${state.fillColor}"` : '';

        if (state.copyMode === 'react') {
          return `<${pascalName} size={${state.size}} color="${state.strokeColor}" strokeWidth={${state.strokeWidth}}${fillProp} />`;
        }

        if (state.copyMode === 'html') {
          return `<i data-lucide="${iconName}" style="width: ${state.size}px; height: ${state.size}px; stroke: ${state.strokeColor}; stroke-width: ${state.strokeWidth}; fill: ${state.fillColor};"></i>`;
        }

        if (state.copyMode === 'svg') {
          const svgEl = cardElement.querySelector('svg');
          return svgEl ? svgEl.outerHTML : '';
        }
      }

      // Render cards
      function renderIcons(filter = '') {
        grid.innerHTML = '';
        const normalized = filter.toLowerCase().trim();
        const filtered = allIcons.filter(name => name.toLowerCase().includes(normalized));

        stats.innerText = `Showing ${filtered.length} / ${allIcons.length} icons`;

        const fragment = document.createDocumentFragment();

        filtered.forEach(iconName => {
          const card = document.createElement('div');
          card.className = 'icon-card';
          card.innerHTML = `
            <i data-lucide="${iconName}"></i>
            <span class="name">${iconName}</span>
          `;

          card.onclick = () => {
            const snippet = getCopySnippet(iconName, card);
            navigator.clipboard.writeText(snippet);
            showToast(`Copied snippet (${state.copyMode.toUpperCase()})`);
          };

          fragment.appendChild(card);
        });

        grid.appendChild(fragment);

        // Convert <i> placeholders into SVGs using Lucide's internal registry
        lucide.createIcons();
      }

      // Initial Mount
      updateCustomProperties();
      renderIcons();

      // Debounced Search
      let debounceTimeout;
      search.addEventListener('input', (e) => {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => {
          renderIcons(e.target.value);
        }, 120);
      });
    });
  </script>
</body>

</html>
